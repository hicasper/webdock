; Webdock defaults. Keep application-specific settings in additional files if needed.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 128M
upload_max_filesize = 16M
post_max_size = 8M
max_execution_time = 60
max_input_time = 60
date.timezone = Asia/Shanghai
