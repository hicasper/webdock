name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests templates)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Build CLI
        run: go build -trimpath -o bin/webdock ./cmd/webdock

  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: webdock-edge
            context: images/edge
            dockerfile: images/edge/Dockerfile
            tag: latest
          - image: webdock-php
            context: images/php
            dockerfile: images/php/Dockerfile
            tag: "8.4"
    env:
      # Keep GHCR disabled by default. Set the repository variable
      # PUBLISH_GHCR=true and enable package write access before using it.
      PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE: ${{ matrix.image }}
          DEFAULT_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          owner="${DOCKERHUB_USERNAME:-hicasper}"
          owner="${owner,,}"
          tags="${owner}/${IMAGE}:${DEFAULT_TAG}"
          tags+=",${owner}/${IMAGE}:sha-${GITHUB_SHA::12}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ref_tag="${GITHUB_REF_NAME//\//-}"
            tags+=",${owner}/${IMAGE}:${ref_tag}"
          fi

          if [[ "${PUBLISH_GHCR}" == "true" ]]; then
            ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
            tags+=",ghcr.io/${ghcr_owner}/${IMAGE}:${DEFAULT_TAG}"
            tags+=",ghcr.io/${ghcr_owner}/${IMAGE}:sha-${GITHUB_SHA::12}"
          fi

          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
