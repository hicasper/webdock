name: CI
on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/webdock/VERSION"
      - "templates/**"
      - "images/**"
      - ".github/workflows/**"
  push:
    branches:
      - master
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/webdock/VERSION"
      - "templates/**"
      - "images/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect changed components
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            nginx:
              - "images/nginx/**"
            php:
              - "images/php/**"

      - name: Build image matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          NGINX_CHANGED: ${{ steps.filter.outputs.nginx }}
          PHP_CHANGED: ${{ steps.filter.outputs.php }}
        run: |
          set -euo pipefail
          images='[]'

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${NGINX_CHANGED}" == "true" ]]; then
            images="$(jq -c '. + [{"component":"nginx","context":"images/nginx","dockerfile":"images/nginx/Dockerfile","tag":"nginx-1.26"}]' <<<"${images}")"
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${PHP_CHANGED}" == "true" ]]; then
            images="$(jq -c '. + [{"component":"php","context":"images/php","dockerfile":"images/php/Dockerfile","tag":"php-8.4"}]' <<<"${images}")"
          fi

          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  test:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests templates)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Build CLI
        run: go build -trimpath -o bin/webdock ./cmd/webdock

  images:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - test
      - changes
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Keep GHCR disabled by default. Set the repository variable
      # PUBLISH_GHCR=true and enable package write access before using it.
      PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMPONENT: ${{ matrix.component }}
          DEFAULT_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          owner="${DOCKERHUB_USERNAME:-hicasper}"
          owner="${owner,,}"
          image="${owner}/webdock"
          tags="${image}:${DEFAULT_TAG}"

          # Commit-scoped tags are intentionally disabled while the project is unstable.
          # tags+=",${image}:${COMPONENT}-sha-${GITHUB_SHA::12}"

          # Versioned Docker tags are intentionally disabled until releases stabilize.
          # if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          #   ref_tag="${GITHUB_REF_NAME//\//-}"
          #   tags+=",${image}:${COMPONENT}-${ref_tag}"
          # fi

          if [[ "${PUBLISH_GHCR}" == "true" ]]; then
            ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
            ghcr_image="ghcr.io/${ghcr_owner}/webdock"
            tags+=",${ghcr_image}:${DEFAULT_TAG}"
            # Commit-scoped tags are intentionally disabled while the project is unstable.
            # tags+=",${ghcr_image}:${COMPONENT}-sha-${GITHUB_SHA::12}"
          fi

          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=webdock-${{ matrix.component }}
          cache-from: type=gha,scope=webdock-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=webdock-${{ matrix.component }}
