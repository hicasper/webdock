name: CI

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/webdock/VERSION"
      - "templates/**"
      - "images/**"
      - ".github/workflows/**"
  push:
    branches:
      - master
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/webdock/VERSION"
      - "templates/**"
      - "images/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      binaries: ${{ steps.matrix.outputs.binaries }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect changed components
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            nginx:
              - "images/nginx/**"
            php:
              - "images/php/**"
            binaries:
              - "cmd/**"
              - "internal/**"
              - "templates/**"
              - "go.mod"
              - "go.sum"

      - name: Build job outputs
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          NGINX_CHANGED: ${{ steps.filter.outputs.nginx }}
          PHP_CHANGED: ${{ steps.filter.outputs.php }}
          BINARIES_CHANGED: ${{ steps.filter.outputs.binaries }}
        run: |
          set -euo pipefail
          images='[]'

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${NGINX_CHANGED}" == "true" ]]; then
            images="$(jq -c '. + [{"component":"nginx","context":"images/nginx","dockerfile":"images/nginx/Dockerfile","tag":"nginx-1.26"}]' <<<"${images}")"
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${PHP_CHANGED}" == "true" ]]; then
            images="$(jq -c '. + [{"component":"php","context":"images/php","dockerfile":"images/php/Dockerfile","tag":"php-8.4"}]' <<<"${images}")"
          fi

          binaries="${BINARIES_CHANGED:-false}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            binaries=true
          fi

          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "binaries=${binaries}" >> "${GITHUB_OUTPUT}"

  test:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests templates)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Build CLI
        run: go build -trimpath -o bin/webdock ./cmd/webdock

  images:
    name: Image ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - test
      - changes
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Keep GHCR disabled by default. Set the repository variable
      # PUBLISH_GHCR=true and enable package write access before using it.
      PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMPONENT: ${{ matrix.component }}
          DEFAULT_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          owner="${DOCKERHUB_USERNAME:-hicasper}"
          owner="${owner,,}"
          image="${owner}/webdock"
          tags="${image}:${DEFAULT_TAG}"

          # Commit-scoped tags are intentionally disabled while the project is unstable.
          # tags+=",${image}:${COMPONENT}-sha-${GITHUB_SHA::12}"

          # Versioned Docker tags are intentionally disabled until releases stabilize.
          # if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          #   ref_tag="${GITHUB_REF_NAME//\//-}"
          #   tags+=",${image}:${COMPONENT}-${ref_tag}"
          # fi

          if [[ "${PUBLISH_GHCR}" == "true" ]]; then
            ghcr_owner="${GITHUB_REPOSITORY_OWNER,,}"
            ghcr_image="ghcr.io/${ghcr_owner}/webdock"
            tags+=",${ghcr_image}:${DEFAULT_TAG}"
            # Commit-scoped tags are intentionally disabled while the project is unstable.
            # tags+=",${ghcr_image}:${COMPONENT}-sha-${GITHUB_SHA::12}"
          fi

          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=webdock-${{ matrix.component }}
          cache-from: type=gha,scope=webdock-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=webdock-${{ matrix.component }}

  build-binaries:
    name: Binary ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test
      - changes
    if: needs.changes.outputs.binaries == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/webdock-linux-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "${output}" ./cmd/webdock
          test -s "${output}"

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum "webdock-linux-${{ matrix.arch }}" > "webdock-linux-${{ matrix.arch }}.sha256"

      - name: Verify amd64 binary
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          expected="webdock $(tr -d '[:space:]' < cmd/webdock/VERSION)"
          actual="$(dist/webdock-linux-amd64 --version)"
          test "${actual}" = "${expected}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdock-linux-${{ matrix.arch }}
          path: |
            dist/webdock-linux-${{ matrix.arch }}
            dist/webdock-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 3

  publish-binaries:
    name: Update GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s dist/webdock-linux-amd64
          test -s dist/webdock-linux-arm64
          test -s dist/webdock-linux-amd64.sha256
          test -s dist/webdock-linux-arm64.sha256
          cd dist
          sha256sum -c webdock-linux-amd64.sha256
          sha256sum -c webdock-linux-arm64.sha256

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < cmd/webdock/VERSION)"
          cat > dist/build-info.txt <<EOF
          version=${version}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat > dist/release-notes.md <<EOF
          Webdock ${version} rolling binary release.

          This release is updated in place whenever the source code changes. Download the binary for your Linux architecture:

          - \`webdock-linux-amd64\`: Linux x86-64
          - \`webdock-linux-arm64\`: Linux ARM64

          Verify the download with the matching \`.sha256\` file. Build details are recorded in \`build-info.txt\`.
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < cmd/webdock/VERSION)"
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Webdock ${tag}" \
              --notes-file dist/release-notes.md
          else
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Webdock ${tag}" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "${tag}" \
            dist/webdock-linux-amd64 \
            dist/webdock-linux-arm64 \
            dist/webdock-linux-amd64.sha256 \
            dist/webdock-linux-arm64.sha256 \
            dist/build-info.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
